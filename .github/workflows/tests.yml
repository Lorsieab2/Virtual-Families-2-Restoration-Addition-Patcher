name: Tests

# Runs the portable part of the suite on every push and pull request, so a
# regression is caught by the PR that introduces it rather than by a playtest.
#
# WHAT THIS RUNS, AND WHY ONLY THIS
#
# tests/ is the portable suite: it needs nothing but the repository itself.
# work/test_*.py is the much larger suite (55 files), but most of those tests
# read build inputs that are deliberately gitignored -- work/vanilla_runtime_payload
# (1835 files) and outputs/ (~290 entries). On a runner those directories are
# absent, so those tests either fail spuriously or, worse, pass while checking a
# fraction of their assertions. Running them here would make the badge lie.
# They stay a local-clone gate, run in C:\vf2w\vf2 before release.
#
# Subtest results are surfaced individually rather than collapsed into one dot
# per test method: the suite leans on unittest subTest heavily (91 subtests in
# tests/ alone), and a subtest failure is otherwise easy to miss in the log.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The JUnit reporter creates a check run and annotates failing lines on a
  # pull request; both need more than contents: read.
  checks: write
  pull-requests: write

concurrency:
  # A newer push to the same branch supersedes an in-flight run.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only, deliberately. The patcher ships on Windows, and the
        # suite is written against it: tests assert on literal Windows paths
        # (for example Path("C:\\VF2 Builds\\...")), so on Linux they fail for
        # a reason that says nothing about the code. Adding ubuntu-latest here
        # produced five such failures on the first run. Making those tests
        # platform-neutral would mean rewriting assertions that are correct as
        # they stand, so the matrix matches the shipping platform instead.
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-subtests
          if [ -f requirements-build.txt ]; then
            python -m pip install -r requirements-build.txt
          fi

      - name: Run portable test suite
        shell: bash
        # -rs reports skipped tests with their reason, so a test that silently
        # stops running because its guard started matching is visible here
        # instead of looking like a pass.
        run: python -m pytest tests/ -v -rs --junitxml=junit-${{ matrix.os }}.xml

      - name: Upload test results
        # Upload on failure too -- that is when the XML is most worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: junit-${{ matrix.os }}.xml
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: junit-${{ matrix.os }}.xml
          # Individual subtest rows land in the run summary and, on a pull
          # request, as annotations on the failing line.
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true
